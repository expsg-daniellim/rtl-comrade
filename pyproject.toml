[build-system]
requires = ["setuptools>=80.9.0", "setuptools-scm[simple]>=9.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rtl-comrade"
version = "0.0.1"
authors = [
  { name = "Daniel Lim" },
]
description = "Graph-based version of rtl_buddy"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]

license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "pyserde[yaml]>=0.31.2",
    "structlog>=25.5.0",
    "typer>=0.25.1",
    "types-pyyaml>=6.0.12.20260510",
]

[project.scripts]
rtl-comrade = "rtl_comrade.__main__:main"
rtl_comrade = "rtl_comrade.__main__:main"

[tool.pylint.format]
indent-string = "\t"
indent-after-paren = 1
max-line-length = 99999

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "fixme",
    "too-few-public-methods",
    "duplicate-code",
    "broad-exception-caught",
    "unused-argument",
    "invalid-slice-index",
    "no-else-return",
    "chained-comparison",
]

[tool.pylint.design]
max-branches = 40
max-statements = 120
max-locals = 25
max-args = 8
max-positional-arguments = 8

[tool.pylint.basic]
good-names = ["i", "j", "k", "n", "e", "f", "id", "Module", "Contract", "Config", "WHITE", "GREY", "BLACK"]

[tool.ty.environment]
extra-paths = ["src"]

[tool.coverage.run]
omit = [
    "src/rtl_comrade/__main__.py",
    "tests/*",
    "contracts/tests/*",
    "modules/tests/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "contracts/tests", "modules/tests", "graphs/tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ty>=0.0.35",
    "pylint>=3.0.0",
]
