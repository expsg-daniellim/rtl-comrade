name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    name: Lint (pylint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --group dev pylint src/ modules/ contracts/ tests

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    container:
      image: verilator/verilator:v5.042
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --group dev pytest tests/ --cov --cov-report=term-missing
